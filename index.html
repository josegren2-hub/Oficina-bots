<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Oficina de los bots · En vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#111827"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="icon" href="./icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Oficina"></head><body>
<canvas id="c"></canvas><div id="capa"></div>
<div id="vivo" class="glass pan"><div class="tit"><span class="rec"></span>En vivo <span id="activos" class="acc"></span></div><div id="lista"></div></div>
<div id="equipo" class="glass pan"><div class="tit">Oficina de los bots</div><div id="resumen"></div><div id="eq"></div></div>
<div id="term" class="glass"><span class="acc">&gt;</span> <span id="ult">Cargando oficina…</span></div>
<div id="ctrl"><button id="bpaneles" class="glass">☰ Paneles</button><div id="pisos" class="glass"></div><button id="bedif" class="glass">🏢 Ver edificio</button></div>
<div id="ficha" class="glass"></div>
<script type="module" src="./src/entrada.js"></script><button id="bact" class="glass" title="Actualizar la oficina">↻ Actualizar</button><div id="avisoNueva" class="glass" hidden>Hay versión nueva · <b>Actualizar</b></div>
<script>(()=>{const V='v16.16',sw=navigator.serviceWorker;let pedido=false;
const aviso=document.getElementById('avisoNueva');
async function forzar(){try{if(window.caches){for(const k of await caches.keys())await caches.delete(k);}if(sw){for(const r of await sw.getRegistrations()){try{await r.update()}catch(e){}await r.unregister();}}}catch(e){}
 location.replace(location.pathname+'?v='+Date.now());}
document.getElementById('bact').onclick=forzar;
if(!sw)return;
function mostrar(reg){aviso.hidden=false;aviso.onclick=()=>{pedido=true;const w=reg&&reg.waiting;if(w)w.postMessage({type:'SKIP_WAITING'});else location.reload();};}
sw.addEventListener('controllerchange',()=>{if(pedido)location.reload();else if(window.__teniaSW)mostrar(null);});
addEventListener('load',async()=>{const tenia=window.__teniaSW=!!sw.controller;const reg=await sw.register('./sw.js',{updateViaCache:'none'});
 if(reg.waiting&&sw.controller)mostrar(reg);
 reg.addEventListener('updatefound',()=>{const n=reg.installing;n&&n.addEventListener('statechange',()=>{if((n.state==='installed'||n.state==='activated')&&tenia)mostrar(reg);});});
 const chk=()=>reg.update().catch(()=>{});chk();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk();});setInterval(chk,3*60e3);});})();</script></body></html>
